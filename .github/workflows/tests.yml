name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install "pytest>=8,<10"
      - name: Run unit tests
        run: pytest -q
      - name: Validate every v1 input design
        run: |
          for file in inputs/*.json; do
            echo "Validating $file"
            python main.py "$file" --validate-only
          done

  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run browser-native generator tests
        run: npm run test:browser
